<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sobi namu 서버 연결 확인</title><style>body{font-family:system-ui;max-width:760px;margin:30px auto;padding:20px;color:#1b2a21}fieldset{margin:20px 0;padding:20px;border:1px solid #ccd8cd;border-radius:14px}input,button,select{font:inherit;padding:10px;margin:5px;max-width:95%}input{width:280px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef4ed;padding:16px}label{display:block}button{cursor:pointer}</style><h1>Sobi namu 서버 연결 확인</h1><p>실제 Supabase 프로젝트가 필요합니다. 비밀키·service_role 키는 입력하지 마세요. 이 페이지는 기존 앱이 아닌 별도 기능 점검 화면입니다.</p><fieldset><legend>1. 프로젝트 연결</legend><label>Project URL<input id="url" placeholder="https://프로젝트.supabase.co"></label><label>공개 publishable / anon 키<input id="key" autocomplete="off"></label><button id="connect">연결 준비</button></fieldset><fieldset><legend>2. 회원 인증</legend><label>이메일<input id="email" type="email"></label><label>비밀번호<input id="password" type="password" autocomplete="current-password"></label><button data-act="signup">회원가입</button><button data-act="signin">로그인</button><button data-act="signout">로그아웃</button><p>이메일 확인이 켜져 있으면 확인 후 로그인하세요.</p><label>닉네임<input id="nickname" maxlength="30"></label><button data-act="register">프로필 등록·수정</button><button data-act="profile">내 상태·친구 코드</button></fieldset><fieldset><legend>3. 서버 성장 계산 점검</legend><p>테스트 프로젝트에서만 예시 기록을 입력하세요. 구매 보상은 지원하지 않습니다.</p><label>물건 이름<input id="item" maxlength="120"></label><select id="action"><option value="check">점검</option><option value="hold">보류</option><option value="no_buy">미구매</option><option value="repair">수리</option><option value="rent">대여</option></select><button data-act="reward">성장 기록</button><button data-act="plant">새로운 씨앗 심기</button></fieldset><fieldset><legend>4. 친구 연결</legend><label>친구 코드<input id="code"></label><button data-act="request">친구 요청</button><button data-act="incoming">받은 요청 조회</button><label>받은 요청의 sender / 친구 user_id<input id="other"></label><button data-act="accept">요청 수락</button><button data-act="remove">요청 취소·거절·친구 해제</button><button data-act="friends">친구 성장 요약</button></fieldset><pre id="out" role="status" aria-live="polite">아직 연결하지 않았습니다.</pre><script type="module">import{createSobiAPI,treeView}from'./sobi-server.js';let api;const val=id=>document.getElementById(id).value.trim();const out=v=>document.getElementById('out').textContent=typeof v==='string'?v:JSON.stringify(v,null,2);document.getElementById('connect').onclick=()=>{try{if(!val('url').startsWith('https://')||!val('key'))throw Error('URL과 공개 키를 확인하세요.');api=createSobiAPI(val('url'),val('key'));out('클라이언트 준비 완료. 아직 서버 접속 성공을 검증한 것은 아닙니다. 로그인 후 내 상태를 조회하세요.');}catch(e){out(e.message)}};document.querySelectorAll('[data-act]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{if(!api)throw Error('먼저 연결 준비를 누르세요.');let r;switch(b.dataset.act){case'signup':r=await api.signUp(val('email'),document.getElementById('password').value);r={userId:r.user?.id,emailConfirmationRequired:!r.session};break;case'signin':r=await api.signIn(val('email'),document.getElementById('password').value);r={userId:r.user?.id,message:'로그인 성공'};break;case'signout':await api.signOut();r='로그아웃 완료';break;case'register':await api.register(val('nickname'));r='프로필 저장 완료';break;case'profile':r=await api.profile();if(r)r={...r,view:treeView(r)};break;case'reward':r=await api.reward(val('item'),val('action'));break;case'plant':await api.plant();r='새 나무 시작';break;case'request':await api.requestFriend(val('code'));r='요청 처리 완료. 기존 관계가 있으면 중복 생성하지 않습니다.';break;case'incoming':r=await api.incoming();break;case'accept':await api.acceptFriend(val('other'));r='수락 완료';break;case'remove':await api.removeFriend(val('other'));r='관계 삭제 처리 완료';break;case'friends':r=await api.friends();break;}out(r??'완료');}catch(e){out(e.message||String(e));}finally{b.disabled=false;}});</script></html>
